<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glamour Lounge</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background: linear-gradient(135deg, #fff5f8 0%, #ffe3ec 100%); 
            color: #4a2834; 
            padding: 20px; 
            margin: 0; 
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle, #fff 10%, transparent 20%),
                radial-gradient(circle, #ffb6c1 15%, transparent 20%),
                radial-gradient(circle, #fff 10%, transparent 20%);
            background-size: 15px 15px, 25px 25px, 30px 30px;
            background-position: 0 0, 10px 15px, 20px 5px;
            opacity: 0.35;
            z-index: -1;
            animation: glitter 8s linear infinite;
        }

        @keyframes glitter {
            0% { background-position: 0 0, 10px 15px, 20px 5px; }
            100% { background-position: 100px 100px, 110px 115px, 120px 105px; }
        }

        .pink-header { 
            text-align: center; 
            padding: 25px 0 15px 0; 
            border-bottom: 2px dashed #ffb6c1; 
            margin-bottom: 25px; 
        }
        .pink-header h1 { 
            color: #ff4d8d; 
            margin: 0; 
            font-size: 32px; 
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        .pink-header p { 
            font-style: italic; 
            font-size: 14px; 
            color: #8b576c; 
            margin-top: 5px; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.85); 
            border: 1px solid #ffe3ec; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
            backdrop-filter: blur(5px);
        }

        .drink-info strong {
            font-size: 17px;
            color: #5c2d40;
        }

        select { 
            background: #fff; 
            color: #ff4d8d; 
            border: 1px solid #ffccd8; 
            padding: 6px 10px; 
            border-radius: 6px; 
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .btn { 
            background: linear-gradient(135deg, #ff75a0 0%, #ff4d8d 100%); 
            color: #fff; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            box-shadow: 0 3px 10px rgba(255, 77, 141, 0.3);
        }

        .cart-bar { 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            background: rgba(255, 245, 248, 0.95); 
            border-top: 2px solid #ff4d8d; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-shadow: 0 -5px 20px rgba(255, 182, 193, 0.3);
        }

        #note, #username {
            padding: 12px; 
            background: #fff; 
            border: 1px solid #ffccd8; 
            color: #4a2834; 
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        #username {
            width: 80%; 
            margin-bottom: 15px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="pink-header">
        <h1>THE LOUNGE</h1>
        <p>✨ Bubbles, Cocktails & Sparkles ✨</p>
    </div>
    
    <div id="queue-box" style="text-align:center; color:#8b576c; margin-bottom:20px; font-size: 14px;">
        Wachtrij: <span id="q-num" style="color:#ff4d8d; font-weight:bold; font-size:16px;">0</span> orders open
    </div>

    <!-- INLOGSCHERM -->
    <div id="login-screen" style="text-align:center; margin-top:50px;">
        <p style="color: #8b576c; font-style: italic; margin-bottom: 15px;">Meld je aan voor toegang tot het menu</p>
        <input type="text" id="username" placeholder="Typ je naam..."><br>
        <button class="btn" onclick="login()">Menu Openen ✨</button>
    </div>

    <!-- MENUKAART -->
    <div id="menu-screen" style="display:none; margin-bottom:170px;">
        <p style="text-align:center; font-style:italic; color: #8b576c; margin-bottom: 20px;">Hey <span id="user-display" style="color:#ff4d8d; font-weight: bold;"></span>, kies je cocktail:</p>
        
        <div class="card" id="card-daiquiri">
            <div class="drink-info"><strong>Strawberry Daiquiri 🍓</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Strawberry Daiquiri', 'card-daiquiri')">+</button>
        </div>

        <div class="card" id="card-ginfizz">
            <div class="drink-info"><strong>Blood Orange Gin Fizz 🍊</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Blood Orange Gin Fizz', 'card-ginfizz')">+</button>
        </div>

        <div class="card" id="card-sunrise">
            <div class="drink-info"><strong>Tequila Sunrise 🌅</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Tequila Sunrise', 'card-sunrise')">+</button>
        </div>

        <div class="card" id="card-goldrush">
            <div class="drink-info"><strong>Irish Gold Rush 🍯</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Irish Gold Rush', 'card-goldrush')">+</button>
        </div>

        <div class="card" id="card-bluelagoon">
            <div class="drink-info"><strong>Blue Lagoon 🌊</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Blue Lagoon', 'card-bluelagoon')">+</button>
        </div>

        <div class="card" id="card-longisland">
            <div class="drink-info"><strong>Long Island Iced Tea 🍹</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Long Island Iced Tea', 'card-longisland')">+</button>
        </div>
    </div>

    <!-- WINKELMAND BALK -->
    <div id="cart-bar" class="cart-bar" style="display:none;">
        <input type="text" id="note" placeholder="Opmerking toevoegen (bijv. extra rietje)...">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="cart-preview" style="font-size:14px; color:#ff4d8d; font-weight: 500;">Mand is nog leeg</div>
            <button class="btn" onclick="send()">Bestellen 💕</button>
        </div>
    </div>

    <script>
        const socket = io();
        let cart = [], myName = localStorage.getItem('bar_name');

        if (myName) { showMenu(); }

        function login() {
            const input = document.getElementById('username').value.trim();
            if (!input) return alert('Vul alstublieft een naam in');
            localStorage.setItem('bar_name', input);
            myName = input;
            showMenu();
        }

        function showMenu() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('cart-bar').style.display = 'block';
            document.getElementById('user-display').innerText = myName;
        }

        // VERANDERD: Zoekt nu via een vast ID naar de juiste dropdown. Dit kan NOOIT misgaan!
        function add(drinkName, cardId) {
            const card = document.getElementById(cardId);
            const strength = card.querySelector('.strength').value;
            cart.push({ name: drinkName, strength: strength });
            
            const counts = {};
            cart.forEach(x => counts[`${x.name} (${x.strength})`] = (counts[`${x.name} (${x.strength})`] || 0) + 1);
            document.getElementById('cart-preview').innerText = Object.entries(counts).map(([k,v]) => `${v}x ${k}`).join(', ');
        }

        function send() {
            if (cart.length === 0) return alert('Je mandje is nog leeg!');
            socket.emit('order', { name: myName, drinks: cart, note: document.getElementById('note').value.trim() });
            cart = [];
            document.getElementById('note').value = '';
            document.getElementById('cart-preview').innerText = 'Mand is nog leeg';
            alert('Je bestelling is onderweg naar de bar! 💕');
        }

        socket.on('queue', (c) => document.getElementById('q-num').innerText = c);
        
        socket.on('ready', (name) => {
            if (name === myName.toLowerCase().trim()) alert('Je drankje staat klaar bij de bar! 🎉💕');
        });
    </script>
</body>
</html>
