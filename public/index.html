<!DOCTYPE html><html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>D2</title><script src="/socket.io/socket.io.js"></script><style>:root{--champagne-gold:#bfa17f;--rose-gold:#c39b9b;--dark-text:#2c2523;--bg-gradient:linear-gradient(135deg,#fbf9f8 0%,#f3ece9 100%)}body{font-family:Georgia,serif;background:var(--bg-gradient);color:var(--dark-text);padding:20px;margin:0;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(circle,#fff 8%,transparent 12%),radial-gradient(circle,rgba(191,161,127,.3) 10%,transparent 15%);background-size:40px 40px,60px 60px;background-position:0 0,20px 30px;opacity:.5;z-index:-1;animation:diamondSparkle 12s linear infinite}@keyframes diamondSparkle{0%{background-position:0 0,20px 30px}100%{background-position:40px 40px,60px 70px}}.elegant-header{text-align:center;padding:30px 0 20px 0;border-bottom:1px solid var(--champagne-gold);margin-bottom:25px}.elegant-header h1{color:var(--dark-text);margin:0;font-size:30px;font-weight:300;text-transform:uppercase;letter-spacing:5px}.elegant-header p{font-style:italic;font-size:13px;color:#7a6e6b;margin-top:8px;letter-spacing:1px}.card{background:rgba(255,255,255,.75);border:1px solid rgba(191,161,127,.2);padding:18px;border-radius:6px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(44,37,35,.04);backdrop-filter:blur(8px)}.drink-info strong{font-size:16px;font-weight:600;letter-spacing:.5px;color:var(--dark-text)}select{background:#fff;color:#555;border:1px solid #dcd1cb;padding:6px 12px;border-radius:4px;font-size:13px;font-family:inherit;outline:none;cursor:pointer}.btn{background:linear-gradient(135deg,#d3bca2 0%,#bfa17f 100%);color:#fff;border:none;padding:10px 22px;border-radius:4px;font-family:inherit;font-size:14px;letter-spacing:1px;cursor:pointer;box-shadow:0 2px 8px rgba(191,161,127,.25)}.btn:active{transform:scale(.98)}.cart-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(251,249,248,.95);border-top:1px solid var(--champagne-gold);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 25px rgba(44,37,35,.05);backdrop-filter:blur(10px)}#note,#username{padding:12px;background:#fff;border:1px solid #dcd1cb;color:var(--dark-text);border-radius:4px;outline:none;font-size:14px;font-family:sans-serif}#note:focus,#username:focus{border-color:var(--champagne-gold)}#username{width:80%;margin-bottom:20px;text-align:center;font-size:15px}</style></head><body><div class="elegant-header"><h1>D2</h1><p>Enjoy at your own risk</p></div><div id="queue-box" style="text-align:center;color:#7a6e6b;margin-bottom:25px;font-size:13px;font-style:italic">Wachtrij: <span id="q-num" style="color:var(--champagne-gold);font-weight:700;font-size:15px;font-style:normal">0</span> orders open</div><div id="login-screen" style="text-align:center;margin-top:40px;"><p style="color:#7a6e6b;font-style:italic;margin-bottom:20px;font-size:14px">Meld u aan voor toegang tot het menu</p><input type="text" id="username" placeholder="Typ uw naam..."><br><button class="btn" onclick="login()">Menu Openen</button></div><div id="menu-screen" style="display:none;margin-bottom:180px;"><p style="text-align:center;font-style:italic;color:#7a6e6b;margin-bottom:25px;font-size:14px">Welkom, <span id="user-display" style="color:var(--champagne-gold);font-weight:700;font-style:normal"></span>. Maak uw selectie:</p><div class="card" id="card-daiquiri"><div class="drink-info"><strong>Strawberry Daiquiri</strong><div style="margin-top:6px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div><button class="btn" onclick="add('Strawberry Daiquiri','card-daiquiri')">+</button></div><div class="card" id="card-ginfizz"><div class="drink-info"><strong>My Passion for Fruit</strong><div style="margin-top:6px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div><button class="btn" onclick="add('My Passion for Fruit','card-ginfizz')">+</button></div><div class="card" id="card-sunrise"><div class="drink-info"><strong>Tequila Sunrise</strong><div style="margin-top:6px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div><button class="btn" onclick="add('Tequila Sunrise','card-sunrise')">+</button></div><div class="card" id="card-goldrush"><div class="drink-info"><strong>Appletini</strong><div style="margin-top:6px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div><button class="btn" onclick="add('Appletini','card-goldrush')">+</button></div><div class="card" id="card-bluelagoon"><div class="drink-info"><strong>Blue Lagoon</strong><div style="margin-top:6px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div><button class="btn" onclick="add('Blue Lagoon','card-bluelagoon')">+</button></div><div class="card" id="card-longisland"><div class="drink-info"><strong>Long Island Iced Tea</strong><div style="margin-top:6px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div><button class="btn" onclick="add('Long Island Iced Tea','card-longisland')">+</button></div></div><div id="cart-bar" class="cart-bar" style="display:none;"><input type="text" id="note" placeholder="Opmerking toevoegen (optioneel)..."><div style="display:flex;justify-content:space-between;align-items:center;"><div id="cart-preview" style="font-size:14px;color:var(--champagne-gold);font-weight:500;font-family:sans-serif">Mand is nog leeg</div><button class="btn" onclick="send()">Bestellen</button></div></div><script>const socket=io();let cart=[];let myName=localStorage.getItem("bar_name");function login(){const e=document.getElementById("username").value.trim();if(!e)return alert("Vul alstublieft een naam in");localStorage.setItem("bar_name",e),myName=e,showMenu()}function showMenu(){document.getElementById("login-screen").style.display="none",document.getElementById("menu-screen").style.display="block",document.getElementById("cart-bar").style.display="block",document.getElementById("user-display").innerText=myName}function add(e,t){const a=document.getElementById(t).querySelector(".strength").value;cart.push({name:e,strength:a});const n={};cart.forEach(e=>n[`${e.name} (${e.strength})`]=(n[`${e.name} (${e.strength})` ]||0)+1),document.getElementById("cart-preview").innerText=Object.entries(n).map(([e,t])=>`${t}x ${e}`).join(", ")}function send(){if(0===cart.length)return alert("Je mandje is nog leeg!");socket.emit("order",{name:myName,drinks:cart,note:document.getElementById("note").value.trim()}),cart=[],document.getElementById("note").value="",document.getElementById("cart-preview").innerText="Mand is nog leeg",alert("Uw selectie is succesvol doorgegeven.")}myName&&showMenu(),socket.on("queue",e=>{document.getElementById("q-num").innerText=e}),socket.on("ready",e=>{e===myName.toLowerCase().trim()&&alert("Uw bestelling staat klaar bij de bar! ✨")});</script></body></html>
