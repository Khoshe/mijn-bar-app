<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lounge</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .gold { color: #d4af37; text-align: center; letter-spacing: 2px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        select { background: #121212; color: #d4af37; border: 1px solid #333; padding: 5px; border-radius: 4px; font-weight: bold; }
        .btn { background: #d4af37; color: #000; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; border-top: 1px solid #d4af37; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <h1 class="gold">THE LOUNGE</h1>
    <div id="queue-box" style="text-align:center; color:#888; margin-bottom:20px;">Wachtrij: <span id="q-num" style="color:#d4af37; font-weight:bold;">0</span> orders</div>

    <!-- INLOGSCHERM -->
    <div id="login-screen" style="text-align:center; margin-top:50px;">
        <input type="text" id="username" placeholder="Uw naam..." style="padding:12px; width:80%; border-radius:4px; border:none; margin-bottom:15px;"><br>
        <button class="btn" onclick="login()">Starten</button>
    </div>

    <!-- MENUKAART -->
    <div id="menu-screen" style="display:none; margin-bottom:150px;">
        <p style="text-align:center; font-style:italic;">Welkom, <span id="user-display" style="color:#d4af37;"></span></p>
        
        <div class="card">
            <div><strong>Strawberry Daiquiri</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Strawberry Daiquiri', this)">+</button>
        </div>

        <div class="card">
            <div><strong>Blood Orange Gin Fizz</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Blood Orange Gin Fizz', this)">+</button>
        </div>

        <div class="card">
            <div><strong>Tequila Sunrise</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Tequila Sunrise', this)">+</button>
        </div>

        <div class="card">
            <div><strong>Irish Gold Rush</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Irish Gold Rush', this)">+</button>
        </div>

        <div class="card">
            <div><strong>Blue Lagoon</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Blue Lagoon', this)">+</button>
        </div>

        <div class="card">
            <div><strong>Long Island Iced Tea</strong><div style="margin-top:5px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div>
            <button class="btn" onclick="add('Long Island Iced Tea', this)">+</button>
        </div>
    </div>

    <!-- WINKELMAND BALK -->
    <div id="cart-bar" class="cart-bar" style="display:none;">
        <input type="text" id="note" placeholder="Opmerking (optioneel)..." style="padding:8px; background:#222; border:none; color:#fff; border-radius:4px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="cart-preview" style="font-size:14px; color:#d4af37;">Mand is leeg</div>
            <button class="btn" onclick="send()">Bestellen</button>
        </div>
    </div>

    <script>
        const socket = io();
        let cart = [], myName = localStorage.getItem('bar_name');

        if (myName) { showMenu(); }

        function login() {
            const input = document.getElementById('username').value.trim();
            if (!input) return alert('Naam verplicht');
            localStorage.setItem('bar_name', input);
            myName = input;
            showMenu();
        }

        function showMenu() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('cart-bar').style.display = 'block';
            document.getElementById('user-display').innerText = myName;
        }

        function add(drinkName, btnNode) {
            const strength = btnNode.parentElement.querySelector('.strength').value;
            cart.push({ name: drinkName, strength: strength });
            
            const counts = {};
            cart.forEach(x => counts[`${x.name} (${x.strength})`] = (counts[`${x.name} (${x.strength})`] || 0) + 1);
            document.getElementById('cart-preview').innerText = Object.entries(counts).map(([k,v]) => `${v}x ${k}`).join(', ');
        }

        function send() {
            if (cart.length === 0) return alert('Mand is leeg!');
            socket.emit('order', { name: myName, drinks: cart, note: document.getElementById('note').value.trim() });
            cart = [];
            document.getElementById('note').value = '';
            document.getElementById('cart-preview').innerText = 'Mand is leeg';
            alert('Bestelling verzonden!');
        }

        socket.on('queue', (c) => document.getElementById('q-num').innerText = c);
        
        socket.on('ready', (name) => {
            if (name === myName.toLowerCase().trim()) alert('Je drankje staat klaar bij de bar! 🎉');
        });
    </script>
</body>
</html>
