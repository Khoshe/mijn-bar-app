<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Your Order</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; background: #00adb5; border: none; color: white; border-radius: 8px; cursor: pointer; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; font-size: 16px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <h2>🍻 Order a Drink</h2>
    <input type="text" id="name" placeholder="Enter Your Name..." required>
    
    <h3>Menu:</h3>
    <button onclick="sendOrder('Beer 🍺')">Cold Beer</button>
    <button onclick="sendOrder('Gin & Tonic 🍸')">Gin & Tonic</button>
    <button onclick="sendOrder('Rum & Coke 🥃')">Rum & Coke</button>
    <button onclick="sendOrder('Water 💧')">Water</button>

    <script>
        const socket = io();
        function sendOrder(drink) {
            const userName = document.getElementById('name').value;
            if(!userName.trim()) { alert('Please enter your name first!'); return; }
            
            socket.emit('new-order', { 
                name: userName, 
                drink: drink, 
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            });
            alert('Order sent! Look at the bartender.');
        }
    </script>
</body>
</html>
