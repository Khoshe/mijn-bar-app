<!DOCTYPE html><html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Dos Dagoes</title><script src="/socket.io/socket.io.js"></script><style>:root{--champagne-gold:#bfa17f;--rose-gold:#c39b9b;--dark-text:#2c2523;--bg-gradient:linear-gradient(135deg,#fbf9f8 0%,#f3ece9 100%)}body{font-family:Georgia,serif;background:var(--bg-gradient);color:var(--dark-text);padding:20px;margin:0;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(circle,#fff 8%,transparent 12%),radial-gradient(circle,rgba(191,161,127,.3) 10%,transparent 15%);background-size:40px 40px,60px 60px;background-position:0 0,20px 30px;opacity:.5;z-index:-1;animation:diamondSparkle 12s linear infinite}@keyframes diamondSparkle{0%{background-position:0 0,20px 30px}100%{background-position:40px 40px,60px 70px}}.elegant-header{text-align:center;padding:30px 0 20px 0;border-bottom:1px solid var(--champagne-gold);margin-bottom:25px}.elegant-header h1{color:var(--dark-text);margin:0;font-size:30px;font-weight:300;text-transform:uppercase;letter-spacing:5px}.elegant-header p{font-style:italic;font-size:13px;color:#7a6e6b;margin-top:8px;letter-spacing:1px}.card{background:rgba(255,255,255,.75);border:1px solid rgba(191,161,127,.2);padding:18px;border-radius:6px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(44,37,35,.04);backdrop-filter:blur(8px)}.drink-info strong{font-size:16px;font-weight:600;letter-spacing:.5px;color:var(--dark-text)}select{background:#fff;color:#555;border:1px solid #dcd1cb;padding:6px 12px;border-radius:4px;font-size:13px;font-family:inherit;outline:none;cursor:pointer}.btn{background:linear-gradient(135deg,#d3bca2 0%,#bfa17f 100%);color:#fff;border:none;padding:10px 22px;border-radius:4px;font-family:inherit;font-size:14px;letter-spacing:1px;cursor:pointer;box-shadow:0 2px 8px rgba(191,161,127,.25);transition:all .3s}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}.cart-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(251,249,248,.95);border-top:1px solid var(--champagne-gold);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 25px rgba(44,37,35,.05);backdrop-filter:blur(10px);transition:all .4s}.cart-active{border-top-color:#d3bca2;box-shadow:0 -10px 30px rgba(191,161,127,.45)}#note,#username{padding:12px;background:#fff;border:1px solid #dcd1cb;color:var(--dark-text);border-radius:4px;outline:none;font-size:14px;font-family:sans-serif}#note:focus,#username:focus{border-color:var(--champagne-gold)}#username{width:80%;margin-bottom:20px;text-align:center;font-size:15px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(44,37,35,.95);color:#fff;padding:12px 25px;border-radius:4px;font-family:sans-serif;font-size:14px;box-shadow:0 5px 20px rgba(0,0,0,.2);z-index:99;opacity:0;transition:all .3s;border:1px solid var(--champagne-gold)}.egg-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(27,23,22,.97);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;box-sizing:border-box}.egg-img{max-width:90%;max-height:65%;border:3px solid var(--champagne-gold);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}</style></head><body><div id="toast" class="toast"></div><div id="egg" class="egg-overlay"><img src="https://preview.redd.it/question-regarding-the-1st-meme-war-v0-exbxbk4la9te1.png?auto=webp&s=4897ad8caf08960b4829ab802d621b4fe1cb9e09" class="egg-img" alt="Easter Egg"><button class="btn" onclick="$('egg').style.display='none'">Ik snap het, sorry... 🍻</button></div><div class="elegant-header"><h1>Club Dos Dagoes</h1><p>Enjoy at your own risk</p></div><div id="queue-box" style="text-align:center;color:#7a6e6b;margin-bottom:25px;font-size:13px;font-style:italic">Wachtrij: <span id="q-num" style="color:var(--champagne-gold);font-weight:700;font-size:15px;font-style:normal">0</span> orders open</div><div id="login-screen" style="text-align:center;margin-top:40px;"><p style="color:#7a6e6b;font-style:italic;margin-bottom:20px;font-size:14px">Meld u aan voor toegang tot het menu</p><input type="text" id="username" placeholder="Typ uw naam..."><br><button class="btn" onclick="login()">Menu Openen</button></div><div id="menu-screen" style="display:none;margin-bottom:180px;"><p style="text-align:center;font-style:italic;color:#7a6e6b;margin-bottom:25px;font-size:14px">Welkom, <span id="user-display" style="color:var(--champagne-gold);font-weight:700;font-style:normal"></span>. Maak uw selectie:</p><div id="menu-container"></div></div><div id="cart-bar" class="cart-bar" style="display:none;"><input type="text" id="note" placeholder="Opmerking toevoegen (optioneel)..."><div style="display:flex;justify-content:space-between;align-items:center;"><div id="cart-preview" style="font-size:14px;color:var(--champagne-gold);font-weight:500;font-family:sans-serif">Mand is nog leeg</div><div style="display:flex;gap:8px;"><button class="btn" style="background:#fff;color:#7a6e6b;border:1px solid #dcd1cb;box-shadow:none;padding:10px 15px" onclick="clearCart()">Legen</button><button class="btn" id="send-btn" onclick="send()" disabled>Bestellen</button></div></div></div><script>const socket=io(),$=i=>document.getElementById(i);let cart=[],myName=localStorage.getItem("bar_name");const drinks=[{id:"daiquiri",n:"Strawberry Daiquiri",ico:"🍓"},{id:"ginfizz",n:"Passion For Fruit",ico:"🍹"},{id:"sunrise",n:"Tequila Sunrise",ico:"🌅"},{id:"goldrush",n:"Appletini",ico:"🍏"},{id:"bluelagoon",n:"Blue Lagoon",ico:"🔷"},{id:"longisland",n:"Long Island Iced Tea",ico:"🥃"}],renderMenu=()=>$("menu-container").innerHTML=drinks.map(d=>`<div class="card" id="card-${d.id}"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:26px">${d.ico}</span><div class="drink-info"><strong>${d.n}</strong><div style="margin-top:4px;"><select class="strength"><option value="Sterk">Sterk</option><option value="Medium">Medium</option></select></div></div></div><button class="btn" onclick="add('${d.n}','card-${d.id}')">+</button></div>`).join(""),showToast=m=>{const t=$("toast");t.innerText=m,t.style.opacity=1,t.style.transform="translateX(-50%) translateY(0)",setTimeout(()=>(t.style.opacity=0,t.style.transform="translateX(-50%) translateY(-20px)"),3500)},login=()=>{const e=$("username").value.trim();if(!e)return alert("Vul alstublieft een naam in");localStorage.setItem("bar_name",myName=e),showMenu()},showMenu=()=>($("login-screen").style.display="none",$("menu-screen").style.display=$("cart-bar").style.display="block",$("user-display").innerText=myName),updateCart=()=>{const e=$("cart-bar"),t=$("send-btn");if(0===cart.length)return $("cart-preview").innerText="Mand is nog leeg",e.classList.remove("cart-active"),void(t.disabled=!0);e.classList.add("cart-active"),t.disabled=!1;const n={};cart.forEach(c=>n[`${c.name} (${c.strength})`]=(n[`${c.name} (${c.strength})` ]||0)+1),$("cart-preview").innerText=Object.entries(n).map(([c,o])=>`${o}x ${c}`).join(", ")},add=(e,t)=>{cart.push({name:e,strength:$(t).querySelector(".strength").value}),updateCart()},clearCart=()=>{(cart=[]),updateCart()},send=()=>{if(0===cart.length)return;const e=new Set(cart.map(c=>c.name));if(e.size===drinks.length)return $("egg").style.display="flex",cart=[],$("note").value="",void updateCart();$("send-btn").disabled=!0,socket.emit("order",{name:myName,drinks:cart,note:$("note").value.trim()}),cart=[],$("note").value="",updateCart(),showToast("Uw selectie is succesvol doorgegeven! ✨")};renderMenu(),myName&&showMenu(),socket.on("queue",e=>$("q-num").innerText=e),socket.on("ready",e=>e===myName.toLowerCase().trim()&&alert("Uw bestelling staat klaar bij de bar! ✨"));</script></body></html>
