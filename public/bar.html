<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #141419; color: #fff; padding: 20px; }
        .order { background: #1f1f26; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-ready { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>📥 Live Bestellingen (<span id="q-num">0</span>)</h2>
    <div id="orders-container"></div>
    <audio id="sound" src="https://mixkit.co" preload="auto"></audio>

    <script>
        const socket = io();
        
        // NIEUW: Zodra het dashboard geladen is, vragen we direct om de gemiste bestellingen
        socket.emit('request-existing-orders');
        
        socket.on('queue', (c) => document.getElementById('q-num').innerText = c);

        socket.on('bar-order', (data) => {
            // Voorkom dat we per ongeluk dubbele kaarten tekenen als de pagina handmatig ververst wordt
            if (document.getElementById(data.id)) return;

            document.getElementById('sound').play().catch(() => {});

            const counts = {};
            data.drinks.forEach(x => counts[`${x.name} [${x.strength}]`] = (counts[`${x.name} [${x.strength}]`] || 0) + 1);
            const listHtml = Object.entries(counts).map(([k,v]) => `<li><strong>${v}x</strong> ${k}</li>`).join('');
            
            const noteHtml = data.note ? `<p style="color:#ff9f43; margin:5px 0 0 0;">📝 "${data.note}"</p>` : '';

            const card = document.createElement('div');
            card.className = 'order';
            card.id = data.id; // Geef de kaart het unieke ID van de server
            card.innerHTML = `
                <div>
                    <h3 style="margin:0;">${data.name}</h3>
                    <ul style="margin:5px 0; padding-left:20px;">${listHtml}</ul>
                    ${noteHtml}
                </div>
                <!-- VERANDERD: We sturen nu het unieke ID mee naar de finish functie -->
                <button class="btn-ready" onclick="finish('${data.id}', '${data.name}', this)">Klaar</button>
            `;
            document.getElementById('orders-container').insertBefore(card, document.getElementById('orders-container').firstChild);
        });

        // VERANDERD: Stuurt nu het orderId mee zodat de server exact weet welke gewist moet worden
        function finish(orderId, name, btn) {
            socket.emit('done', orderId, name);
            btn.parentElement.remove();
        }
    </script>
</body>
</html>
