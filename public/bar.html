<!DOCTYPE html><html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bar Dashboard Control</title><script src="/socket.io/socket.io.js"></script><style>body{font-family:sans-serif;background:#141419;color:#fff;padding:20px;margin:0}.dashboard-layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}@media(max-width:768px){the dashboard-layout{grid-template-columns:1fr}}.order{background:#1f1f26;border:1px solid #333;padding:15px;border-radius:8px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}.btn-ready{background:#28a745;color:#fff;border:none;padding:10px 15px;border-radius:4px;font-weight:700;cursor:pointer}.history-panel{background:#1a1a24;border:1px solid #d4af37;padding:20px;border-radius:8px;position:sticky;top:20px;height:fit-content}.history-list{list-style:none;padding:0;margin:15px 0 0 0;line-height:2}.history-list li{border-bottom:1px solid #2d2d3a;padding:5px 0;display:flex;justify-content:space-between;font-size:16px}.gold{color:#d4af37}</style></head><body><h2>🍸 D2 Bar Control Center</h2><div class="dashboard-layout"><div><h3>📥 Live Bestellingen (<span id="q-num">0</span>)</h3><div id="orders-container"></div></div><div class="history-panel"><h3 class="gold">📊 Totaal weggeschonken</h3><ul id="total-history-list" class="history-list"><li style="color:#666;font-style:italic;border:none">Nog geen drankjes gemaakt...</li></ul></div></div><audio id="sound" src="https://mixkit.co" preload="auto"></audio><script>const socket=io();socket.emit("request-existing-orders"),socket.on("queue",e=>document.getElementById("q-num").innerText=e),socket.on("init-totals",e=>renderTotals(e)),socket.on("update-totals",e=>renderTotals(e)),socket.on("bar-order",e=>{if(!document.getElementById(e.id)){document.getElementById("sound").play().catch(()=>{});const t={};e.drinks.forEach(e=>t[`${e.name} [${e.strength}]`]=(t[`${e.name} [${e.strength}]` ]||0)+1);const a=Object.entries(t).map(([e,t])=>`<li><strong>${t}x</strong> ${e}</li>`).join(""),n=e.note?`<p style="color:#ff9f43;margin:5px 0 0 0">📝 "${e.note}"</p>`:"",o=document.createElement("div");o.className="order",o.id=e.id,o.innerHTML=`<div><h3 style="margin:0">${e.name}</h3><ul style="margin:5px 0;padding-left:20px">${a}</ul>${n}</div><button class="btn-ready" onclick="finish('${e.id}','${e.name}',this)">Klaar</button>`,document.getElementById("orders-container").insertBefore(o,document.getElementById("orders-container").firstChild)}});function finish(e,t,a){socket.emit("done",e,t),a.parentElement.remove()}function renderTotals(e){const t=document.getElementById("total-history-list");if(t){if(0===Object.keys(e).length)returnvoid(t.innerHTML='<li style="color:#666;font-style:italic;border:none">Nog geen drankjes gemaakt...</li>');t.innerHTML=Object.entries(e).map(([e,v])=>`<li><span>${e}</span><strong class="gold">${v}x</strong></li>`).join("")}}</script></body></html>
