<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Control Center</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #141419; --card: #1f1f26; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #fff; padding: 20px; margin: 0; }
        h2 { font-weight: 300; letter-spacing: 2px; color: var(--gold); border-bottom: 1px solid #333; padding-bottom: 15px; margin-top: 0; }
        .order-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .order-card { background: var(--card); border-radius: 8px; border: 1px solid #2d2d3a; box-shadow: 0 4px 10px rgba(0,0,0,0.3); padding: 20px; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s ease; }
        .order-details h3 { margin: 0 0 5px 0; color: #fff; font-size: 20px; font-weight: 500; }
        .table-badge { background: var(--gold); color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 14px; margin-left: 10px; }
        .drink-list { margin: 10px 0 0 0; padding-left: 20px; color: #b3b3cc; font-size: 16px; }
        .time-stamp { color: #666; font-size: 12px; margin-top: 5px; display: block; }
        .done-btn { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .done-btn:hover { background: #218838; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h2>📥 Live Bestellingen Overzicht</h2>
    <div class="order-container" id="order-list"></div>

    <audio id="notification-sound" src="https://mixkit.co" preload="auto"></audio>

    <script>
        const socket = io();
        const orderList = document.getElementById('order-list');
        const sound = document.getElementById('notification-sound');

        socket.on('bar-receive-order', (data) => {
            sound.play().catch(e => console.log("Audio play blocked"));

            // Tel de drankjes voor nette weergave (bijv: 2x Beer)
            const counts = {};
            data.drinks.forEach(x => counts[x] = (counts[x] || 0) + 1);
            const drinkItemsHtml = Object.entries(counts)
                .map(([name, qty]) => `<li><strong>${qty}x</strong> ${name}</li>`)
                .join('');

            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <div class="order-details">
                    <h3>${data.name} <span class="table-badge">Tafel ${data.table}</span></h3>
                    <ul class="drink-list">${drinkItemsHtml}</ul>
                    <span class="time-stamp">Ontvangen om: ${data.time}</span>
                </div>
                <button class="done-btn" onclick="this.parentElement.remove()">Klaar</button>
            `;
            
            orderList.insertBefore(card, orderList.firstChild);
        });
    </script>
</body>
</html>
