<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bar Dashboard Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body{font-family:sans-serif;background:#141419;color:#fff;padding:20px;margin:0}
        .dashboard-layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}
        @media(max-width:768px){.dashboard-layout{grid-template-columns:1fr}}
        .order{background:#1f1f26;border:1px solid #333;padding:15px;border-radius:8px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
        .btn-ready{background:#28a745;color:#fff;border:none;padding:10px 15px;border-radius:4px;font-weight:700;cursor:pointer}
        .history-panel{background:#1a1a24;border:1px solid #d4af37;padding:20px;border-radius:8px;position:sticky;top:20px;height:fit-content}
        .member-block{background:#22222e;border:1px solid #333;padding:12px;border-radius:6px;margin-bottom:12px}
        .member-name{color:#d4af37;font-weight:700;margin:0 0 5px 0;font-size:16px;text-transform:capitalize}
        .member-drinks{margin:0;padding-left:15px;color:#aaa;font-size:14px;line-height:1.4}
        .gold{color:#d4af37}
        
        /* Nieuwe stijlen voor het voorraadbeheer */
        .stock-panel{background:#1f1f26;border:1px solid #444;padding:15px;border-radius:8px;margin-bottom:20px}
        .stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
        .stock-btn{padding:10px;border-radius:4px;border:none;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background 0.2s;color:#fff}
        .stock-btn.available{background:#2eb84e}
        .stock-btn.available:hover{background:#24963e}
        .stock-btn.sold-out{background:#a72828;opacity:0.6}
        .stock-btn.sold-out:hover{background:#bd3333}
    </style>
</head>
<body>
    <h2>🍸 D2 Bar Control Center</h2>
    
    <!-- NIEUW: Cocktails In/Uitschakelen Sectie -->
    <div class="stock-panel">
        <h3 style="margin-top:0" class="gold">📋 Voorraadbeheer (Klik om uit te schakelen)</h3>
        <div class="stock-grid" id="stock-container"></div>
    </div>

    <div class="dashboard-layout">
        <div>
            <h3>📥 Live Bestellingen (<span id="q-num">0</span>)</h3>
            <div id="orders-container"></div>
        </div>
        <div class="history-panel">
            <h3 class="gold">📊 Consumpties Per Lid</h3>
            <div id="total-history-list">
                <div style="color:#666;font-style:italic">Nog geen leden die gedronken hebben...</div>
            </div>
        </div>
    </div>

    <audio id="sound" src="https://mixkit.co" preload="auto"></audio>

    <script>
        const socket=io();
        
        // Drankjes definitie synchroon met de klantzijde
        const drinks=[
            {id:"daiquiri",n:"Strawberry Daiquiri",ico:"🍓"},
            {id:"ginfizz",n:"Passion For Fruit",ico:"🍹"},
            {id:"sunrise",n:"Tequila Sunrise",ico:"🌅"},
            {id:"goldrush",n:"Appletini",ico:"🍏"},
            {id:"bluelagoon",n:"Blue Lagoon",ico:"🔷"},
            {id:"longisland",n:"Long Island Iced Tea",ico:"🥃"}
        ];

        socket.emit("request-existing-orders");
        socket.on("queue",e=>document.getElementById("q-num").innerText=e);
        socket.on("init-totals",e=>renderTotals(e));
        socket.on("update-totals",e=>renderTotals(e));
        
        // NIEUW: Luister naar updates van de voorraadstatus om de knoppen te kleuren
        socket.on("stock-update", (stockStatus) => {
            const container = document.getElementById("stock-container");
            container.innerHTML = drinks.map(d => {
                const isAvailable = stockStatus[d.id] !== false;
                return `<button class="stock-btn ${isAvailable ? 'available' : 'sold-out'}" onclick="toggleDrink('${d.id}')">
                    <span>${d.ico}</span>
                    <span>${d.n}</span>
                    <span style="font-size:10px;display:block">${isAvailable ? '●' : '✕'}</span>
                </button>`;
            }).join("");
        });

        // NIEUW: Geef aan de server door dat een drankje moet wisselen van status
        function toggleDrink(drinkId) {
            socket.emit("toggle-drink", drinkId);
        }

        socket.on("bar-order",e=>{
            if(!document.getElementById(e.id)){
                document.getElementById("sound").play().catch(()=>{});
                const t={};
                e.drinks.forEach(e=>t[`${e.name} [${e.strength}]`]=(t[`${e.name} [${e.strength}]` ]||0)+1);
                const a=Object.entries(t).map(([e,t])=>`<li><strong>${t}x</strong> ${e}</li>`).join(""),
                n=e.note?`<p style="color:#ff9f43;margin:5px 0 0 0">📝 "${e.note}"</p>`:"",
                o=document.createElement("div");
                o.className="order",o.id=e.id,o.innerHTML=`<div><h3 style="margin:0">${e.name}</h3><ul style="margin:5px 0;padding-left:20px">${a}</ul>${n}</div><button class="btn-ready" onclick="finish('${e.id}','${e.name}',this)">Klaar</button>`,document.getElementById("orders-container").insertBefore(o,document.getElementById("orders-container").firstChild)
            }
        });

        function finish(e,t,a){socket.emit("done",e,t),a.parentElement.remove()}
        
        function renderTotals(e){
            const t=document.getElementById("total-history-list");
            if(t){
                if(0===Object.keys(e).length)return void(t.innerHTML='<div style="color:#666;font-style:italic">Nog geen leden die gedronken hebben...</div>');
                let a="";
                Object.entries(e).forEach(([e,n])=>{
                    const o=Object.entries(n).map(([e,t])=>`<li>${t}x ${e}</li>`).join("");
                    a+=`<div class="member-block"><div class="member-name">${e}</div><ul class="member-drinks">${o}</ul></div>`
                }),t.innerHTML=a
            }
        }
    </script>
</body>
</html>
