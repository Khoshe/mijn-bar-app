<!DOCTYPE html><html lang="nl"><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Bar Dashboard Control</title><script src="/socket.io/socket.io.js"></script><style>body{font-family:sans-serif;background:#141419;color:#fff;padding:20px;margin:0}.dashboard-layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}@media(max-width:768px){.dashboard-layout{grid-template-columns:1fr}}.order{background:#1f1f26;border:1px solid #333;padding:15px;border-radius:8px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;animation:slideIn 0.3s ease-out}@keyframes slideIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}.btn-ready{background:#28a745;color:#fff;border:none;padding:10px 15px;border-radius:4px;font-weight:700;cursor:pointer}.btn-delete{background:#dc3545;color:#fff;border:none;padding:10px 15px;border-radius:4px;font-weight:700;cursor:pointer;transition:background 0.2s}.btn-delete:hover{background:#bd2130}.history-panel{background:#1a1a24;border:1px solid #d4af37;padding:20px;border-radius:8px;position:sticky;top:20px;height:fit-content}.member-block{background:#22222e;border:1px solid #333;padding:12px;border-radius:6px;margin-bottom:12px}.member-name{color:#d4af37;font-weight:700;margin:0 0 5px 0;font-size:16px;text-transform:capitalize}.member-drinks{margin:0;padding-left:15px;color:#aaa;font-size:14px;line-height:1.4}.gold{color:#d4af37}.stock-panel{background:#1f1f26;border:1px solid #444;padding:15px;border-radius:8px;margin-bottom:20px}.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}.stock-btn{padding:10px;border-radius:4px;border:none;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;color:#fff;transform:translateZ(0)}.stock-btn.available{background:#2eb84e}.stock-btn.available:hover{background:#24963e}.stock-btn.sold-out{background:#a72828;opacity:.6}.stock-btn.sold-out:hover{background:#bd3333}</style></head><body><h2>🍸 D2 Bar Control Center</h2><div class="stock-panel"><h3 style="margin-top:0" class="gold">📋 Voorraadbeheer (Klik om uit te schakelen)</h3><div class="stock-grid" id="stock-container"></div></div><div class="dashboard-layout"><div><h3>📥 Live Bestellingen (<span id="q-num">0</span>)</h3><div id="orders-container"></div></div><div class="history-panel"><h3 class="gold">📊 Consumpties Per Lid</h3><div id="total-history-list"><div style="color:#666;font-style:italic">Nog geen leden die gedronken hebben...</div></div></div></div><audio id="sound" src="https://mixkit.co" preload="auto"></audio><script>const socket=io(),drinks=[{id:"daiquiri",n:"Strawberry Daiquiri",ico:"🍓"},{id:"ginfizz",n:"Passion For Fruit",ico:"🍹"},{id:"sunrise",n:"Tequila Sunrise",ico:"🌅"},{id:"goldrush",n:"Appletini",ico:"🍏"},{id:"bluelagoon",n:"Blue Lagoon",ico:"🔷"},{id:"longisland",n:"Long Island Iced Tea",ico:"🥃"}];socket.emit("request-existing-orders"),socket.on("queue",e=>document.getElementById("q-num").innerText=e),socket.on("init-totals",e=>renderTotals(e)),socket.on("update-totals",e=>renderTotals(e)),socket.on("stock-update",e=>{const t=document.getElementById("stock-container");t.innerHTML=drinks.map(t=>{const n=e[t.id]!==!1;return`<button class="stock-btn ${n?'available':'sold-out'}" onclick="toggleDrink('${t.id}')"><span>${t.ico}</span><span>${t.n}</span><span style="font-size:10px;display:block">${n?'●':'✕'}</span></button>`}).join("")});function toggleDrink(e){socket.emit("toggle-drink",e)}socket.on("bar-order",e=>{if(!document.getElementById(e.id)){const t=document.getElementById("sound");t.currentTime=0;t.play().catch(e=>console.log("Klik op het scherm om geluid te activeren."));const n={};e.drinks.forEach(e=>n[`${e.name} [${e.strength}]`]=(n[`${e.name} [${e.strength}]` ]||0)+1);const a=Object.entries(n).map(([e,t])=>`<li><strong>${t}x</strong> ${e}</li>`).join(""),o=e.note?`<p style="color:#ff9f43;margin:5px 0 0 0">📝 "${e.note}"</p>`:"",r=document.createElement("div");r.className="order",r.id=e.id,r.innerHTML=`<div><h3 style="margin:0">${e.name}</h3><ul style="margin:5px 0;padding-left:20px">${a}</ul>${o}</div><div style="display:flex;gap:8px;"><button class="btn-ready" onclick="finish('${e.id}','${e.name}',this)">Klaar</button><button class="btn-delete" onclick="removeOrder('${e.id}','${e.name}',this)">Verwijder</button></div>`,document.getElementById("orders-container").insertBefore(r,document.getElementById("orders-container").firstChild)}});function finish(e,t,n){socket.emit("done",e,t),n.parentElement.parentElement.remove()}function removeOrder(e,t,n){if(confirm(`Weet je zeker dat je de bestelling van ${t} wilt verwijderen?`)){socket.emit("cancel-order",e,t);n.parentElement.parentElement.remove()}}function renderTotals(e){const t=document.getElementById("total-history-list");if(t){if(0===Object.keys(e).length)return void(t.innerHTML='<div style="color:#666;font-style:italic">Nog geen leden die gedronken hebben...</div>');let n="";Object.entries(e).forEach(([e,t])=>{const a=Object.entries(t).map(([e,t])=>`<li>${t}x ${e}</li>`).join("");n+=`<div class="member-block"><div class="member-name">${e}</div><ul class="member-drinks">${a}</ul></div>`}),t.innerHTML=n}}</script></body></html>
