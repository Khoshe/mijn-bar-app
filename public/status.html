<!DOCTYPE html><html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Dos Dagoes - Order Status</title><script src="/socket.io/socket.io.js"></script><style>:root{--champagne-gold:#bfa17f;--rose-gold:#d4a5a5;--dark-rose:#8b6b6b;--dark-text:#2c2523;--bg-gradient:linear-gradient(135deg,#f4e8e5 0%,#e1b6b0 50%,#cba29c 100%)}body{font-family:Georgia,serif;background:var(--bg-gradient);color:var(--dark-text);padding:30px;margin:0;box-sizing:border-box;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(circle,#fff 6%,transparent 10%),radial-gradient(circle,rgba(212,165,165,.4) 8%,transparent 12%),radial-gradient(circle,rgba(255,255,255,.8) 4%,transparent 8%);background-size:50px 50px,70px 70px,30px 30px;background-position:0 0,25px 35px,10px 15px;opacity:.65;z-index:-1;animation:glitterSparkle 6s linear infinite}@keyframes glitterSparkle{0%{background-position:0 0,25px 35px,10px 15px;filter:brightness(1)}50%{filter:brightness(1.15)}100%{background-position:50px 50px,95px 105px,40px 45px;filter:brightness(1)}}.elegant-header{text-align:center;padding:30px 0 20px 0;border-bottom:1px solid var(--rose-gold);margin-bottom:30px}.elegant-header h1{color:var(--dark-text);margin:0;font-size:32px;font-weight:300;text-transform:uppercase;letter-spacing:5px}.elegant-header p{font-style:italic;font-size:14px;color:var(--dark-rose);margin-top:8px;letter-spacing:2px}.status-container{display:grid;grid-template-columns:1fr 1fr;gap:30px;height:calc(100vh - 160px)}.column{background:rgba(255,255,255,.55);border:1px solid rgba(212,165,165,.3);border-radius:8px;padding:22px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(139,107,107,.05);backdrop-filter:blur(12px)}.column h2{text-align:center;margin-top:0;font-size:20px;font-weight:300;text-transform:uppercase;letter-spacing:3px;padding-bottom:15px;border-bottom:1px solid rgba(212,165,165,.3);color:var(--dark-text)}.col-making h2{color:var(--dark-rose);font-style:italic}.col-ready h2{color:#b68580;font-weight:600}.name-list{list-style:none;padding:0;margin:0;overflow-y:auto;flex-grow:1;display:flex;flex-direction:column;gap:12px}.name-card{background:rgba(255,255,255,.85);border:1px solid rgba(212,165,165,.25);border-left:4px solid var(--rose-gold);padding:14px 18px;border-radius:4px;font-size:18px;font-weight:600;text-transform:capitalize;letter-spacing:1px;color:var(--dark-text);box-shadow:0 2px 10px rgba(139,107,107,.02);animation:fadeIn 0.5s ease forwards}.col-ready .name-card{border-left-color:#b68580;background:rgba(255,255,255,.95);animation:pulseReady 2s infinite, fadeIn 0.5s ease forwards}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulseReady{0%{box-shadow:0 4px 15px rgba(182,133,128,.15)}70%{box-shadow:0 4px 20px rgba(182,133,128,.45)}100%{box-shadow:0 4px 15px rgba(182,133,128,.15)}}.empty-msg{color:var(--dark-rose);text-align:center;font-style:italic;margin-top:10px;font-size:15px}</style></head><body><div class="elegant-header"><h1>Club Dos Dagoes</h1><p>Live Order Tracking</p></div><div class="status-container"><div class="column col-making"><h2>⏳ Wordt gemaakt</h2><div class="name-list" id="making-list"></div></div><div class="column col-ready"><h2>✨ Klaar bij de bar!</h2><div class="name-list" id="ready-list"></div></div></div><script>const socket=io(),$=i=>document.getElementById(i);socket.on("status-update",e=>{const t=$("making-list"),n=$("ready-list");if(e.active.length===0){t.innerHTML='<div class="empty-msg">Geen actieve bestellingen...</div>'}else{const s=new Set(e.active.map(e=>e.name.trim().toLowerCase()));t.innerHTML=Array.from(s).map(e=>`<div class="name-card">${e}</div>`).join("")}if(e.completed.length===0){n.innerHTML='<div class="empty-msg">Nog geen drankjes klaar...</div>'}else{n.innerHTML=e.completed.map(e=>`<div class="name-card">${e.toLowerCase()}</div>`).join("")}});</script></body></html>
