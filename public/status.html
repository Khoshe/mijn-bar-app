<!DOCTYPE html><html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Dos Dagoes - Order Status</title><script src="/socket.io/socket.io.js"></script><style>:root{--champagne-gold:#bfa17f;--rose-gold:#c39b9b;--dark-text:#2c2523;--bg-gradient:linear-gradient(135deg,#fbf9f8 0%,#f3ece9 100%)}body{font-family:Georgia,serif;background:var(--bg-gradient);color:var(--dark-text);padding:30px;margin:0;box-sizing:border-box;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(circle,#fff 8%,transparent 12%),radial-gradient(circle,rgba(191,161,127,.3) 10%,transparent 15%);background-size:40px 40px,60px 60px;background-position:0 0,20px 30px;opacity:.5;z-index:-1;animation:diamondSparkle 12s linear infinite}@keyframes diamondSparkle{0%{background-position:0 0,20px 30px}100%{background-position:40px 40px,60px 70px}}.elegant-header{text-align:center;padding:30px 0 20px 0;border-bottom:1px solid var(--champagne-gold);margin-bottom:30px}.elegant-header h1{color:var(--dark-text);margin:0;font-size:32px;font-weight:300;text-transform:uppercase;letter-spacing:5px}.elegant-header p{font-style:italic;font-size:14px;color:#7a6e6b;margin-top:8px;letter-spacing:2px}.status-container{display:grid;grid-template-columns:1fr 1fr;gap:30px;height:calc(100vh - 160px)}.column{background:rgba(255,255,255,.65);border:1px solid rgba(191,161,127,.2);border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:0 4px 20px rgba(44,37,35,.04);backdrop-filter:blur(8px)}.column h2{text-align:center;margin-top:0;font-size:20px;font-weight:300;text-transform:uppercase;letter-spacing:3px;padding-bottom:15px;border-bottom:1px solid rgba(191,161,127,.2);color:var(--dark-text)}.col-making h2{color:#7a6e6b;font-style:italic}.col-ready h2{color:var(--champagne-gold);font-weight:600}.name-list{list-style:none;padding:0;margin:0;overflow-y:auto;flex-grow:1;display:flex;flex-direction:column;gap:12px}.name-card{background:rgba(255,255,255,.8);border:1px solid rgba(191,161,127,.15);border-left:4px solid var(--rose-gold);padding:14px 18px;border-radius:4px;font-size:18px;font-weight:600;text-transform:capitalize;letter-spacing:1px;color:var(--dark-text);box-shadow:0 2px 10px rgba(44,37,35,.02);animation:fadeIn 0.5s ease forwards}.col-ready .name-card{border-left-color:var(--champagne-gold);background:rgba(251,249,248,.95);animation:pulseReady 2s infinite, fadeIn 0.5s ease forwards}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulseReady{0%{box-shadow:0 4px 20px rgba(191,161,127,.15)}70%{box-shadow:0 4px 20px rgba(191,161,127,.4)}100%{box-shadow:0 4px 20px rgba(191,161,127,.15)}}.empty-msg{color:#7a6e6b;text-align:center;font-style:italic;margin-top:10px;font-size:15px}</style></head><body><div class="elegant-header"><h1>Club Dos Dagoes</h1><p>Live Order Tracking</p></div><div class="status-container"><div class="column col-making"><h2>⏳ Wordt gemaakt</h2><div class="name-list" id="making-list"></div></div><div class="column col-ready"><h2>✨ Klaar bij de bar!</h2><div class="name-list" id="ready-list"></div></div></div><script>const socket=io(),$=i=>document.getElementById(i);socket.on("status-update",e=>{const t=$("making-list"),n=$("ready-list");if(e.active.length===0){t.innerHTML='<div class="empty-msg">Geen actieve bestellingen...</div>'}else{const s=new Set(e.active.map(e=>e.name.trim().toLowerCase()));t.innerHTML=Array.from(s).map(e=>`<div class="name-card">${e}</div>`).join("")}if(e.completed.length===0){n.innerHTML='<div class="empty-msg">Nog geen drankjes klaar...</div>'}else{n.innerHTML=e.completed.map(e=>`<div class="name-card">${e.toLowerCase()}</div>`).join("")}});</script></body></html>
