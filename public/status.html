<!DOCTYPE html><html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Dos Dagoes - Order Status</title><script src="/socket.io/socket.io.js"></script><style>:root{--champagne-gold:#bfa17f;--rose-gold:#c39b9b;--dark-text:#2c2523;--bg-gradient:linear-gradient(135deg,#141419 0%,#1a1a24 100%)}body{font-family:Georgia,serif;background:var(--bg-gradient);color:#fff;padding:30px;margin:0;box-sizing:border-box;overflow:hidden}.header{text-align:center;padding-bottom:20px;border-bottom:1px solid var(--champagne-gold);margin-bottom:30px}.header h1{margin:0;font-size:32px;font-weight:300;text-transform:uppercase;letter-spacing:6px;color:#fff}.status-container{display:grid;grid-template-columns:1fr 1fr;gap:40px;height:calc(100vh - 150px)}.column{background:rgba(255,255,255,.03);border:1px solid rgba(191,161,127,.1);border-radius:12px;padding:25px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.3)}.column h2{text-align:center;margin-top:0;font-size:22px;text-transform:uppercase;letter-spacing:2px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.1)}.col-making h2{color:var(--rose-gold)}.col-ready h2{color:#2eb84e}.name-list{list-style:none;padding:0;margin:0;overflow-y:auto;flex-grow:1;display:flex;flex-direction:column;gap:12px}.name-card{background:rgba(255,255,255,.05);border-left:4px solid var(--champagne-gold);padding:15px 20px;border-radius:4px;font-size:20px;font-weight:600;text-transform:capitalize;letter-spacing:1px;animation:fadeIn 0.5s ease forwards}.col-ready .name-card{border-left-color:#2eb84e;background:rgba(46,184,78,.08);animation:pulseReady 2s infinite, fadeIn 0.5s ease forwards}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulseReady{0%{box-shadow:0 0 0 0 rgba(46,184,78,.2)}70%{box-shadow:0 0 0 10px rgba(46,184,78,0)}100%{box-shadow:0 0 0 0 rgba(46,184,78,0)}}.empty-msg{color:#555;text-align:center;font-style:italic;margin-top:4px;font-size:16px}</style></head><body><div class="header"><h1>Club Dos Dagoes</h1><p style="color:var(--champagne-gold);margin:5px 0 0 0;font-style:italic;letter-spacing:2px">Live Order Tracking</p></div><div class="status-container"><div class="column col-making"><h2>⏳ Wordt gemaakt</h2><div class="name-list" id="making-list"></div></div><div class="column col-ready"><h2>✨ Klaar bij de bar!</h2><div class="name-list" id="ready-list"></div></div></div><script>const socket=io(),$=i=>document.getElementById(i);socket.on("status-update",e=>{const t=$("making-list"),n=$("ready-list");if(e.active.length===0){t.innerHTML='<div class="empty-msg">Geen actieve bestellingen...</div>'}else{const s=new Set(e.active.map(e=>e.name.trim().toLowerCase()));t.innerHTML=Array.from(s).map(e=>`<div class="name-card">${e}</div>`).join("")}if(e.completed.length===0){n.innerHTML='<div class="empty-msg">Nog geen drankjes klaar...</div>'}else{n.innerHTML=e.completed.map(e=>`<div class="name-card">${e.toLowerCase()}</div>`).join("")}});</script></body></html>
